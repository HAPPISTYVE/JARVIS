<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <title>LAM WebRender - JARVIS Avatar</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }

    #LAM_WebRender {
      position: absolute;
      top: 50%;
      left: 50%;
      /* Le -60% sur l'axe Y remonte le conteneur un peu plus haut que le centre mathématique */
      transform: translate(-50%, -80%);
      width: 100%;
      height: 100%;
      background-color: transparent; 
    }

    #LAM_WebRender canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>

<body>

  <div id="LAM_WebRender"></div>

  <script type="module" src="/src/main.ts"></script>

  <!-- Console debug mobile temporaire -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>
    eruda.init();
  </script>

</body>

</html>
