<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <title>LAM WebRender - JARVIS Avatar</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: "0x05070d";

    }

    #LAM_WebRender {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -80%);
      width: 100%;
      height: 100%;
      background-color: #0x05070d; 
    }

    /* Force le canvas 3D à être entièrement noir pour éliminer la zone blanche */
    #LAM_WebRender canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      background-color: #0x05070d !important;
    }
  </style>
</head>

<body>

  <div id="LAM_WebRender"></div>

  <script type="module" src="/src/main.ts"></script>

  <!-- Console debug mobile temporaire -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>
    eruda.init();
  </script>

</body>

</html>
